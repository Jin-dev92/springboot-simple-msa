# compose 가 서비스 이름(discovery-server 등)을 DNS 이름으로 등록해 주므로,
# 컨테이너끼리는 IP 를 몰라도 이름만으로 서로를 찾을 수 있다.
# 다만 그 DNS 로 찾을 수 있는 것은 '컨테이너'까지이고, 어떤 인스턴스가 살아 있는지,
# 몇 개가 떠 있는지를 다루는 것은 여전히 Eureka 의 몫이다.

# 경고: JWT_SECRET 기본값은 학습용이다. 저장소에 올라간 열쇠는 이미 유출된 열쇠이므로,
# 실제 서비스에서는 Secrets Manager/Vault 등에서 주입해야 한다.
# 여기서는 `JWT_SECRET=... docker compose up` 으로 덮어쓸 수 있게만 해 두었다.

services:
  # KRaft 모드로 동작하므로 ZooKeeper 컨테이너가 따로 필요 없다.
  # 호스트 포트를 열지 않는다. 브로커는 내부 통신용이고, 확인은 docker compose exec 로 한다.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 브로커가 1대뿐이므로 내부 토픽 복제본도 1개로 낮춘다. (운영 기본값은 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30

  # 각 서비스가 보낸 span 을 모아 하나의 요청 흐름으로 보여 준다.
  # 저장소를 지정하지 않으면 메모리에 담으므로, 재시작하면 추적 기록도 사라진다.
  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - "9411:9411"

  discovery-server:
    build:
      context: .
      args:
        SERVICE: discovery-server
    ports:
      - "8761:8761"   # Eureka 대시보드를 브라우저로 확인하기 위해 외부에 연다.
    healthcheck:
      # bash 의 /dev/tcp 로 포트가 열렸는지만 확인한다. curl 을 설치할 필요가 없다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8761"]
      interval: 3s
      timeout: 2s
      retries: 30

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:-learning-only-secret-key-do-not-use-in-production-32bytes+}

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    ports:
      - "8080:8080"   # 외부로 열리는 유일한 진입점
    depends_on:
      # service_healthy: 컨테이너가 '시작'된 것이 아니라 '준비 완료'될 때까지 기다린다.
      # 이게 없으면 Eureka 가 아직 포트를 열기 전에 등록을 시도해 실패 로그가 쌓인다.
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # 레지스트리를 얼마나 자주 갱신할지. 기본값 30초는 학습 중 기다리기 답답해서 줄였다.
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:-learning-only-secret-key-do-not-use-in-production-32bytes+}

  # product-service, order-service, payment-service 는 호스트 포트를 열지 않는다.
  # 외부에서 직접 접근할 방법이 없고, 반드시 게이트웨이를 거쳐야 한다.
  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    depends_on:
      # service_healthy: 컨테이너가 '시작'된 것이 아니라 '준비 완료'될 때까지 기다린다.
      # 이게 없으면 Eureka 가 아직 포트를 열기 전에 등록을 시도해 실패 로그가 쌓인다.
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:-learning-only-secret-key-do-not-use-in-production-32bytes+}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # HTTP 엔드포인트가 아예 없고 Kafka 명령만 받는다. 그래서 호스트 포트도,
  # 검증할 토큰도 없어 JWT_SECRET 을 주입하지 않는다.
  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    depends_on:
      # service_healthy: 컨테이너가 '시작'된 것이 아니라 '준비 완료'될 때까지 기다린다.
      # 이게 없으면 Eureka 가 아직 포트를 열기 전에 등록을 시도해 실패 로그가 쌓인다.
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:-learning-only-secret-key-do-not-use-in-production-32bytes+}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
