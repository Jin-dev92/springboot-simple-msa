plugins {
    // 루트 프로젝트 자체는 애플리케이션이 아니므로 플러그인을 적용하지 않고 버전만 선언한다.
    id 'org.springframework.boot' version '3.5.3' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'

    group = 'com.example.msa'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // BOM(Bill of Materials): 개별 라이브러리 버전을 일일이 적지 않아도
        // 서로 호환되는 조합을 한 번에 고정해 주는 의존성 목록이다.
        implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.3')
        implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.0.0')

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // java 플러그인의 기본 jar 태스크는 라이브러리용 '-plain.jar' 를 함께 만든다.
    // 실행 가능한 것은 bootJar 뿐이므로, Dockerfile 이 잘못된 jar 를 집지 않도록 꺼 둔다.
    tasks.named('jar') {
        enabled = false
    }
}
