server:
  # 포트를 0 으로 두면 OS 가 빈 포트를 임의로 할당한다.
  # 주소를 하드코딩할 수 없게 만들어, 디스커버리가 실제로 동작하는지 강제로 확인시킨다.
  port: 0

spring:
  application:
    # 다른 서비스가 이 이름으로 우리를 찾는다. Eureka 에 등록되는 키가 된다.
    name: product-service
  datasource:
    url: jdbc:h2:mem:productdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # data.sql 이 Hibernate 의 테이블 생성보다 먼저 실행되지 않도록 미룬다.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # 포트가 매번 달라지므로, 인스턴스를 구분할 고유 ID 를 직접 만들어 준다.
    # (Phase 3 에서 같은 서비스를 여러 개 띄울 때 필요하다.)
    instance-id: ${spring.application.name}:${random.uuid}
