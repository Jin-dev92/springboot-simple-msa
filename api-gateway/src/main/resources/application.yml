server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 로그인은 토큰을 받기 위한 통로이므로 인증 없이 통과시킨다.
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            # uri 의 lb:// 는 "Eureka 에서 이 이름으로 인스턴스를 찾아 부하를 나눠 보내라"는 뜻이다.
            # http://localhost:8081 같은 실제 주소는 어디에도 등장하지 않는다.
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                # 앞의 경로 조각 1개(/api)를 떼고 전달한다. → 내부에서는 /orders/** 로 받는다.
                - StripPrefix=1

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      # 컨테이너 안에서 localhost 는 자기 자신이므로, Docker 로 띄울 때는
      # EUREKA_SERVER_URL 환경변수로 discovery-server 를 가리키게 덮어쓴다.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  tracing:
    sampling:
      # 요청의 몇 %를 추적할지. 학습용이라 전부(1.0) 남긴다.
      # 운영에서는 부하와 저장 비용 때문에 0.1 이하로 두는 경우가 많다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

jwt:
  # 모든 서비스가 같은 열쇠를 알아야 서명을 검증할 수 있다.
  # 경고: 학습용 기본값이다. 실제 서비스에서는 Secrets Manager/Vault 로 주입해야 한다.
  secret: ${JWT_SECRET:learning-only-secret-key-do-not-use-in-production-32bytes+}
