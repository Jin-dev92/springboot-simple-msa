server:
  port: 0

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      # 컨테이너 안에서 localhost 는 자기 자신이므로, Docker 로 띄울 때는
      # EUREKA_SERVER_URL 환경변수로 discovery-server 를 가리키게 덮어쓴다.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
