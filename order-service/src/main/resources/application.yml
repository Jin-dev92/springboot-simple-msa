server:
  port: 0

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # 메시지 헤더에 발신측 자바 클래스 이름을 박지 않는다.
        # 박아 두면 수신측이 같은 패키지·같은 클래스를 갖도록 강요받아,
        # 공통 모듈을 두지 않기로 한 이 프로젝트의 방침과 충돌한다.
        spring.json.add.type.headers: false
    template:
      # 메시지 헤더에 추적 정보를 실어 보낸다. 이걸 켜야 Zipkin 에서
      # HTTP 요청과 그로 인해 발행된 Kafka 이벤트가 하나의 trace 로 묶인다.
      observation-enabled: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.msa.order.SagaReply
        spring.json.trusted.packages: com.example.msa.order
    listener:
      observation-enabled: true

  cloud:
    openfeign:
      circuitbreaker:
        # @FeignClient 의 fallbackFactory 를 실제로 동작시키려면 이 스위치가 필요하다.
        enabled: true
      client:
        config:
          default:
            # 타임아웃을 짧게 잡는다. 이 값이 길면 상대가 응답 없이 매달려 있을 때
            # 우리 서비스의 스레드가 그만큼 묶여 함께 느려진다.
            connectTimeout: 2000
            readTimeout: 2000

eureka:
  client:
    service-url:
      # 컨테이너 안에서 localhost 는 자기 자신이므로, Docker 로 띄울 때는
      # EUREKA_SERVER_URL 환경변수로 discovery-server 를 가리키게 덮어쓴다.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    instance-id: ${spring.application.name}:${random.uuid}

management:
  tracing:
    sampling:
      # 요청의 몇 %를 추적할지. 학습용이라 전부(1.0) 남긴다.
      # 운영에서는 부하와 저장 비용 때문에 0.1 이하로 두는 경우가 많다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

jwt:
  # 모든 서비스가 같은 열쇠를 알아야 서명을 검증할 수 있다.
  # 경고: 학습용 기본값이다. 실제 서비스에서는 Secrets Manager/Vault 로 주입해야 한다.
  secret: ${JWT_SECRET:learning-only-secret-key-do-not-use-in-production-32bytes+}

saga:
  timeout:
    # 이 시간 동안 응답이 없으면 멈춘 것으로 보고 보상을 시작한다.
    # 학습용이라 짧게 잡았다. 실제로는 참여자의 정상 처리 시간 분포를 보고
    # 꼬리 지연(p99)보다 넉넉히 크게 잡아야 멀쩡한 요청을 취소하지 않는다.
    threshold: 30s
    # 위 임계를 넘은 사가가 있는지 확인하는 주기.
    check-interval: 10s

replica:
  verify:
    # 복제본과 원본을 대조하는 주기. 복제 지연보다 넉넉히 커야 한다.
    # 짧게 잡으면 정상적인 지연이 계속 불일치로 잡혀 경보가 무의미해진다.
    interval: 15s
    # 연속 몇 번 어긋나야 결함으로 볼 것인가.
    # 결과적 일관성에서 단발 불일치는 정상이므로 1 로 두면 안 된다.
    mismatch-threshold: 3
  # 기동 시 상품 복제본이 비어 있으면 토픽을 처음부터 읽어 다시 세운다.
  # 인메모리 H2 는 재시작하면 비워지는데 컨슈머 그룹 오프셋은 브로커에 남아,
  # 이게 없으면 복제본이 빈 채로 굳는다. 실제로 재현되는 결함이다.
  rebuild-on-startup: true

outbox:
  # outbox 테이블에 쌓인 메시지를 내보내는 주기.
  # 이 값이 곧 발행 지연의 상한이다. 짧게 잡을수록 지연은 줄지만 빈 조회가 늘어난다.
  # 폴링 대신 CDC 를 쓰면 이 트레이드오프 자체가 사라진다.
  poll-interval: 1s
