server:
  # 포트를 0 으로 두면 OS 가 빈 포트를 임의로 할당한다.
  # 주소를 하드코딩할 수 없게 만들어, 디스커버리가 실제로 동작하는지 강제로 확인시킨다.
  port: 0

spring:
  application:
    # 다른 서비스가 이 이름으로 우리를 찾는다. Eureka 에 등록되는 키가 된다.
    name: product-service
  datasource:
    url: jdbc:h2:mem:productdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # data.sql 이 Hibernate 의 테이블 생성보다 먼저 실행되지 않도록 미룬다.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: product-service
      # earliest: 컨슈머 그룹이 처음 만들어질 때 토픽의 맨 처음부터 읽는다.
      # 이 서비스가 꺼져 있는 동안 쌓인 이벤트를 놓치지 않기 위해 필요하다.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # 발신측이 클래스 정보를 헤더에 담지 않으므로, 어떤 타입으로 읽을지 여기서 정한다.
        spring.json.value.default.type: com.example.msa.product.OrderCreatedEvent
        spring.json.trusted.packages: com.example.msa.product

eureka:
  client:
    service-url:
      # 컨테이너 안에서 localhost 는 자기 자신이므로, Docker 로 띄울 때는
      # EUREKA_SERVER_URL 환경변수로 discovery-server 를 가리키게 덮어쓴다.
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    # 포트가 매번 달라지므로, 인스턴스를 구분할 고유 ID 를 직접 만들어 준다.
    # (Phase 3 에서 같은 서비스를 여러 개 띄울 때 필요하다.)
    instance-id: ${spring.application.name}:${random.uuid}
